name=MaestroPCA
version=0.9.0
author=Mike Eddington, R2-D2 Simulator project
maintainer=Mike Eddington
sentence=A Pololu-Maestro-style servo sequencer for the PCA9685, with a drop-in Maestro serial interface.
paragraph=Plays Maestro-style sequences (quarter-microsecond targets, per-channel speed and acceleration) on one or more PCA9685 boards, with a restartScript(n) API so Padawan360-style sketches convert with a two-line change. The companion MaestroLink class answers the Pololu Maestro's own serial protocol, so a spare Nano becomes a drop-in Maestro replacement and the host sketch needs no changes at all. Sequence data is generated from a Maestro settings file (.mstr) or from the R2-D2 Simulator and PCA Studio.
category=Device Control
url=https://github.com/mikeeddington-lgtm/r2d2-sim
architectures=*
depends=Adafruit PWM Servo Driver Library
