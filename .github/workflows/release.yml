# Tag a version, get a downloadable simulator — and the manual with it.
#
# The single-file build is NOT in the repository — it is 7.7 MB of generated
# output and a tracked copy goes stale (see .gitignore). So it is built here
# and attached to the release, which is what the README's download link
# points at.
#
#   git tag v1.44.0 && git push origin v1.44.0
name: release

# ---------------------------------------------------------------------
# ACTION VERSIONS: pinned to majors that run on the **node24** runtime.
# GitHub deprecated node20 for actions, and every run raised a warning
# until this bump (2026-08-17). If those warnings come back, the runtime
# has moved on again — bump the majors, do not silence the warning.
# ---------------------------------------------------------------------

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright and its browser
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Build
        run: ./build.sh

      # The manual assembles from docs/manual/media/, which IS tracked — no
      # browser, no ffmpeg, no capture pass. Re-capturing is a human job
      # (tools/video-rig/cap_docs.js) done when the UI it points at moves.
      - name: Assemble the builder's manual
        run: python3 docs/manual/src/build.py

      - name: Run the suites before publishing anything
        run: ./test.sh

      - name: Attach the simulator to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            R2D2-Simulator.html
            pca-studio/PCA-Studio.html
            docs/manual/R2D2-Simulator-Manual.html
            docs/manual/quickstart.html
            docs/manual/bench-card.html
          body: |
            **Download `R2D2-Simulator.html` and open it in Chrome or Edge.**
            That is the whole installation — one self-contained file, no server,
            no internet. `PCA-Studio.html` is the standalone servo bench.

            **New to it?** `R2D2-Simulator-Manual.html` is the builder's
            manual — twenty chapters with seven screen-capture clips, in one
            offline file like the simulator itself. `quickstart.html` is the
            first hour on one printed side; `bench-card.html` is the servo
            bench card for the workshop wall.

            See CREDITS.md for what in this file belongs to other people, and
            on what terms.
          generate_release_notes: true
