# Build both targets and run every suite, on every push and pull request.
#
# The suites drive a headless Chromium through Playwright and take a few
# minutes; they are the only thing standing between a change and a droid
# moving the wrong way, so they run on everything.
name: tests

# ---------------------------------------------------------------------
# ACTION VERSIONS: pinned to majors that run on the **node24** runtime.
# GitHub deprecated node20 for actions, and every run raised a warning
# until this bump (2026-08-17). If those warnings come back, the runtime
# has moved on again — bump the majors, do not silence the warning.
# ---------------------------------------------------------------------

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # The Arduino side. It needs g++ and Pololu's library and nothing else, so
  # it runs beside the browser suites rather than after them.
  #
  # This guards the two DOWNLOADABLE PACKS the README links to: that each
  # sketch folder still carries its own byte-identical copy of the library,
  # that both sketches compile from that folder alone with nothing installed,
  # that Config.h exists and is actually read, and that make-packs.sh can
  # still build the zips a release attaches. A pack that ships broken fails
  # here instead of on a stranger's bench.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch Pololu's own Maestro library
        run: git clone --depth 1 https://github.com/pololu/maestro-arduino.git /tmp/maestro-arduino

      - name: Compile the library, the sketches and the packs
        run: arduino/MaestroPCA/test/run.sh

  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright and its browser
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Build both targets and PCA Studio
        run: ./build.sh

      - name: Run every suite against both builds
        # swiftshader: the runner has no GPU, and three.js falls back to a
        # software rasteriser. The suites already load with ?norender for
        # exactly this reason.
        run: ./test.sh

      - name: Keep the built file for inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: R2D2-Simulator
          path: R2D2-Simulator.html
          retention-days: 14
